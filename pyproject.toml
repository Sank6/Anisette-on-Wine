[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anisette-on-wine"
version = "0.1.0"
description = "Run an anisette service with the Windows iCloud libraries under Wine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anisette-on-wine = "windows_anisette.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
